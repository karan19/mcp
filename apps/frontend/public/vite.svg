<!-- Variant 1: Server stack + branching nodes -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>MCP server: rack with branching nodes</title>
  <g stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- rack posts -->
    <rect x="32" y="44" width="152" height="48" rx="12"/>
    <rect x="32" y="104" width="152" height="48" rx="12"/>
    <rect x="32" y="164" width="152" height="48" rx="12"/>
    <!-- LEDs -->
    <circle cx="54" cy="68" r="6"/>
    <circle cx="74" cy="68" r="6"/>
    <circle cx="54" cy="128" r="6"/>
    <circle cx="74" cy="128" r="6"/>
    <circle cx="54" cy="188" r="6"/>
    <circle cx="74" cy="188" r="6"/>
    <!-- slots -->
    <line x1="98" y1="68" x2="168" y2="68"/>
    <line x1="98" y1="128" x2="168" y2="128"/>
    <line x1="98" y1="188" x2="168" y2="188"/>
    <!-- stand -->
    <line x1="108" y1="212" x2="108" y2="236"/>
    <line x1="56" y1="236" x2="160" y2="236"/>
    <!-- branching nodes -->
    <circle cx="206" cy="62" r="10"/>
    <circle cx="226" cy="96" r="10"/>
    <circle cx="206" cy="130" r="10"/>
    <line x1="184" y1="92" x2="206" y2="62"/>
    <line x1="184" y1="92" x2="226" y2="96"/>
    <line x1="184" y1="92" x2="206" y2="130"/>
  </g>
</svg>
