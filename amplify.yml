version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace frontend
      artifacts:
        baseDirectory: apps/frontend/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/frontend/node_modules/**/*
